<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALRAA - Deputados e Comissões | Participação Cidadã Açores</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Cabeçalho + Navegação entre Páginas -->
        <header class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b border-gray-200 pb-6">
            <div>
                <h1 class="text-3xl font-bold text-blue-900">ALRAA — Participação Cidadã</h1>
                <p class="text-gray-600 mt-1">Assembleia Legislativa da Região Autónoma dos Açores</p>
            </div>

            <nav class="inline-flex rounded-xl bg-gray-100 p-1 border border-gray-200 self-start md:self-auto">
                <button id="navDeputados" onclick="mudarPagina('deputados')" class="px-4 py-2 rounded-lg text-sm font-bold bg-blue-900 text-white shadow-xs transition-all cursor-pointer">
                    Deputados
                </button>
                <button id="navComissoes" onclick="mudarPagina('comissoes')" class="px-4 py-2 rounded-lg text-sm font-bold text-gray-700 hover:text-gray-900 transition-all cursor-pointer">
                    Comissões
                </button>
            </nav>
        </header>

        <!-- ==================== PÁGINA 1: DEPUTADOS ==================== -->
        <main id="paginaDeputados">
            <!-- Resumo Dinâmico da Composição -->
            <section id="resumoComposicao" class="mb-8 bg-white rounded-2xl shadow-sm border border-gray-100 p-6"></section>

            <!-- Filtros -->
            <div class="flex flex-col sm:flex-row justify-center gap-4 mb-8">
                <select id="filtroPartido" class="p-2.5 border border-gray-200 rounded-xl shadow-xs bg-white text-sm" onchange="filtrarDeputados()">
                    <option value="">Todos os Partidos</option>
                    <option value="PSD">PSD</option>
                    <option value="PS">PS</option>
                    <option value="CH">CHEGA</option>
                    <option value="CDS-PP">CDS-PP</option>
                    <option value="IL">IL</option>
                    <option value="BE">BE</option>
                    <option value="PAN">PAN</option>
                    <option value="PPM">PPM</option>
                </select>

                <select id="filtroCirculo" class="p-2.5 border border-gray-200 rounded-xl shadow-xs bg-white text-sm" onchange="filtrarDeputados()">
                    <option value="">Todas as Ilhas / Círculos</option>
                    <option value="São Miguel">São Miguel</option>
                    <option value="Terceira">Terceira</option>
                    <option value="Pico">Pico</option>
                    <option value="Faial">Faial</option>
                    <option value="São Jorge">São Jorge</option>
                    <option value="Santa Maria">Santa Maria</option>
                    <option value="Graciosa">Graciosa</option>
                    <option value="Flores">Flores</option>
                    <option value="Corvo">Corvo</option>
                    <option value="Compensação">Círculo de Compensação</option>
                </select>
            </div>

            <!-- Grelha de Deputados -->
            <div id="grelhaDeputados" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
        </main>

        <!-- ==================== PÁGINA 2: COMISSÕES ==================== -->
        <main id="paginaComissoes" class="hidden space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div>
                    <p class="text-xs font-bold uppercase tracking-wider text-blue-900">XIII Legislatura — Em Funções</p>
                    <h2 class="text-2xl font-bold text-gray-900 mt-0.5">Comissões Parlamentares Atuais</h2>
                </div>

                <input id="pesquisaComissao" type="text" placeholder="Pesquisar comissão ou deputado..." oninput="renderizarComissoes()" class="p-2.5 border border-gray-200 rounded-xl bg-white text-sm w-full md:w-72">
            </div>

            <!-- Grelha compacta que expande a largura total ao clicar -->
            <div id="listaComissoes" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
        </main>

    </div>

    <script>
        let deputados = [];
        let listaAtual = [];
        let deputadoSelecionadoId = null;
        let abaAtiva = "historico";
        let paginaAtiva = "deputados";
        let comissaoSelecionadaKey = null;

        const coresPartidos = {
            "PSD": "bg-orange-100 text-orange-800 border border-orange-200",
            "PS": "bg-rose-100 text-rose-800 border border-rose-200",
            "CH": "bg-blue-100 text-blue-900 border border-blue-200",
            "CDS-PP": "bg-sky-100 text-sky-800 border border-sky-200",
            "IL": "bg-amber-100 text-amber-900 border border-amber-200",
            "BE": "bg-red-100 text-red-800 border border-red-200",
            "PAN": "bg-emerald-100 text-emerald-800 border border-emerald-200",
            "PPM": "bg-blue-50 text-blue-700 border border-blue-200"
        };

        function mudarPagina(pagina) {
            paginaAtiva = pagina;
            const mainDep = document.getElementById("paginaDeputados");
            const mainCom = document.getElementById("paginaComissoes");
            const btnDep = document.getElementById("navDeputados");
            const btnCom = document.getElementById("navComissoes");

            if (pagina === "deputados") {
                mainDep.classList.remove("hidden");
                mainCom.classList.add("hidden");
                btnDep.className = "px-4 py-2 rounded-lg text-sm font-bold bg-blue-900 text-white shadow-xs transition-all cursor-pointer";
                btnCom.className = "px-4 py-2 rounded-lg text-sm font-bold text-gray-700 hover:text-gray-900 transition-all cursor-pointer";
            } else {
                mainDep.classList.add("hidden");
                mainCom.classList.remove("hidden");
                btnCom.className = "px-4 py-2 rounded-lg text-sm font-bold bg-blue-900 text-white shadow-xs transition-all cursor-pointer";
                btnDep.className = "px-4 py-2 rounded-lg text-sm font-bold text-gray-700 hover:text-gray-900 transition-all cursor-pointer";
                renderizarComissoes();
            }
        }

        async function carregarDeputados() {
            try {
                const response = await fetch('deputados.json');
                deputados = await response.json();
                listaAtual = deputados;
                renderizarResumo(deputados);
                renderizarDeputados(listaAtual);
            } catch (error) {
                console.error("Erro ao carregar o ficheiro JSON:", error);
                document.getElementById("grelhaDeputados").innerHTML =
                    `<p class="col-span-full text-center text-red-500 py-8">Erro ao carregar os dados. Executa o scraper.py e abre com Live Server.</p>`;
            }
        }

        function renderizarResumo(lista) {
            const container = document.getElementById("resumoComposicao");
            if (!container) return;

            const total = lista.length;
            const porPartido = {};
            const porCirculo = {};
            let totalCompensacao = 0;

            lista.forEach(dep => {
                const partido = (dep.partido || "N/D").trim();
                const circulo = (dep.circulo || "N/D").trim();
                porPartido[partido] = (porPartido[partido] || 0) + 1;

                if (circulo.toLowerCase().includes("compensação")) {
                    totalCompensacao += 1;
                } else {
                    porCirculo[circulo] = (porCirculo[circulo] || 0) + 1;
                }
            });

            const partidosOrdenados = Object.entries(porPartido).sort((a, b) => b[1] - a[1]);
            const ilhasOrdenadas = Object.entries(porCirculo).sort((a, b) => b[1] - a[1]);

            container.innerHTML = `
                <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 pb-5 border-b border-gray-100">
                    <div>
                        <p class="text-xs font-bold uppercase tracking-wider text-blue-900">Panorama da Assembleia</p>
                        <h2 class="text-xl font-bold text-gray-900 mt-0.5">Composição em Funções</h2>
                    </div>
                    <div class="flex flex-wrap items-center gap-3">
                        <div class="bg-blue-50 border border-blue-100 rounded-xl px-4 py-2 text-center">
                            <span class="block text-[11px] uppercase tracking-wider text-blue-700 font-semibold">Total</span>
                            <span class="text-xl font-extrabold text-blue-950">${total}</span>
                        </div>
                        <div class="bg-amber-50 border border-amber-100 rounded-xl px-4 py-2 text-center">
                            <span class="block text-[11px] uppercase tracking-wider text-amber-800 font-semibold">Compensação</span>
                            <span class="text-xl font-extrabold text-amber-950">${totalCompensacao}</span>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 pt-5">
                    <div class="lg:col-span-5 space-y-2.5">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500">Por Partido</h3>
                        <div class="flex flex-wrap gap-2">
                            ${partidosOrdenados.map(([sigla, qtd]) => {
                                const cor = coresPartidos[sigla] || "bg-gray-100 text-gray-800 border border-gray-200";
                                return `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold ${cor}">${sigla} <span class="opacity-80">(${qtd})</span></span>`;
                            }).join("")}
                        </div>
                    </div>
                    <div class="lg:col-span-7 space-y-2.5">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500">Por Ilha / Círculo Eleitoral</h3>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                            ${ilhasOrdenadas.map(([ilha, qtd]) => `
                                <div class="flex items-center justify-between bg-gray-50 border border-gray-100 rounded-lg px-3 py-2 text-sm">
                                    <span class="text-gray-700 font-medium">${ilha}</span>
                                    <span class="font-bold text-blue-900">${qtd}</span>
                                </div>
                            `).join("")}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderizarConteudoAba(dep) {
            if (abaAtiva === "historico") {
                const h = dep.historico || {};
                const periodos = (h.periodos || []).map(p => `<li class="text-xs text-gray-700">• ${p}</li>`).join("") || `<li class="text-xs text-gray-400">Sem registo</li>`;
                const atuais = (h.comissoes_atuais || []).map(c => `<li class="text-xs text-emerald-800 bg-emerald-50 border border-emerald-100 rounded-lg px-2.5 py-1.5">${c}</li>`).join("") || `<li class="text-xs text-gray-400">Nenhuma comissão atual registada</li>`;
                const anteriores = (h.comissoes_anteriores || []).map(c => `<li class="text-xs text-gray-600">• ${c}</li>`).join("") || `<li class="text-xs text-gray-400">Sem registo</li>`;
                const intervencoes = (h.intervencoes || []).map(item => `
                    <div class="p-3 bg-white rounded-lg border border-gray-100">
                        <span class="text-[11px] font-bold text-blue-800">${item.data}</span>
                        <p class="text-xs text-gray-700 mt-1 leading-relaxed">${item.assunto}</p>
                    </div>
                `).join("") || `<p class="text-xs text-gray-400">Sem intervenções registadas.</p>`;
                const requerimentos = (h.requerimentos || []).map(item => `
                    <div class="p-3 bg-white rounded-lg border border-gray-100">
                        <span class="text-[11px] font-bold text-blue-800">${item.data}</span>
                        <p class="text-xs text-gray-700 mt-1 leading-relaxed">${item.assunto}</p>
                    </div>
                `).join("") || `<p class="text-xs text-gray-400">Sem requerimentos registados.</p>`;

                return `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 space-y-3">
                            <div>
                                <h5 class="text-xs font-bold uppercase tracking-wider text-blue-900 mb-1.5">Períodos de Funções</h5>
                                <ul class="space-y-1">${periodos}</ul>
                            </div>
                            <hr class="border-gray-200">
                            <div>
                                <h5 class="text-xs font-bold uppercase tracking-wider text-emerald-900 mb-1.5">Comissões Atuais</h5>
                                <ul class="space-y-1.5">${atuais}</ul>
                            </div>
                            <hr class="border-gray-200">
                            <div>
                                <h5 class="text-xs font-bold uppercase tracking-wider text-gray-600 mb-1.5">Comissões Anteriores</h5>
                                <ul class="space-y-1">${anteriores}</ul>
                            </div>
                        </div>

                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 space-y-2 max-h-80 overflow-y-auto">
                            <h5 class="text-xs font-bold uppercase tracking-wider text-blue-900 sticky top-0 bg-gray-50 pb-1">
                                Intervenções em Plenário (${(h.intervencoes || []).length})
                            </h5>
                            <div class="space-y-2">${intervencoes}</div>
                        </div>

                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 space-y-2 max-h-80 overflow-y-auto">
                            <h5 class="text-xs font-bold uppercase tracking-wider text-blue-900 sticky top-0 bg-gray-50 pb-1">
                                Requerimentos (${(h.requerimentos || []).length})
                            </h5>
                            <div class="space-y-2">${requerimentos}</div>
                        </div>
                    </div>
                `;
            }

            if (abaAtiva === "biografia") {
                const b = dep.biografia || {};
                const campos = [
                    ["Nome Completo", b.nome_completo],
                    ["Data de Nascimento", b.nascimento],
                    ["Estado Civil", b.estado_civil],
                    ["Habilitações Literárias", b.habilitacoes],
                    ["Profissão", b.profissao],
                    ["Regime de Exclusividade", b.exclusividade],
                    ["Cargo(s) que Desempenha", b.cargos],
                    ["Contacto Oficial", b.email ? `<a href="mailto:${b.email}" class="text-blue-700 underline">${b.email}</a>` : ""]
                ];
                return `
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                        ${campos.map(([label, val]) => `
                            <div class="bg-gray-50 p-3.5 rounded-xl border border-gray-100">
                                <span class="block text-[11px] font-bold uppercase tracking-wider text-gray-400">${label}</span>
                                <span class="block text-sm font-medium text-gray-800 mt-1">${val || "—"}</span>
                            </div>
                        `).join("")}
                    </div>
                `;
            }

            if (abaAtiva === "interesses") {
                const it = dep.interesses || {};
                const campos = [
                    ["Cargo(s) Exercido(s)", it.cargos_exercidos],
                    ["Cargos Sociais", it.cargos_sociais],
                    ["Sociedades", it.sociedades],
                    ["Serviços Prestados", it.servicos],
                    ["Apoios ou Benefícios", it.apoios],
                    ["Outras Situações", it.outras]
                ];
                return `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${campos.map(([label, val]) => `
                            <div class="bg-gray-50 p-3.5 rounded-xl border border-gray-100">
                                <span class="block text-[11px] font-bold uppercase tracking-wider text-blue-900">${label}</span>
                                <p class="text-xs text-gray-700 mt-1 leading-relaxed">${val || "Nada a observar"}</p>
                            </div>
                        `).join("")}
                    </div>
                `;
            }

            if (abaAtiva === "vencimentos") {
                const vencs = dep.vencimentos || [];
                if (vencs.length === 0) return `<p class="text-xs text-gray-400">Sem registo de vencimentos.</p>`;
                return `
                    <div class="max-h-72 overflow-y-auto rounded-xl border border-gray-200">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-gray-100 text-gray-600 uppercase sticky top-0">
                                <tr>
                                    <th class="px-4 py-2.5">Ano</th>
                                    <th class="px-4 py-2.5">Mês</th>
                                    <th class="px-4 py-2.5">Valor Líquido</th>
                                    <th class="px-4 py-2.5">Observações</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 bg-white">
                                ${vencs.map(v => `
                                    <tr class="hover:bg-gray-50">
                                        <td class="px-4 py-2 font-semibold text-gray-800">${v.ano}</td>
                                        <td class="px-4 py-2 text-gray-700">${v.mes}</td>
                                        <td class="px-4 py-2 font-bold text-blue-900">${v.liquido}</td>
                                        <td class="px-4 py-2 text-gray-500">${v.obs || "—"}</td>
                                    </tr>
                                `).join("")}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            if (abaAtiva === "presencas") {
                const pres = dep.presencas || [];
                const totalSessoes = pres.length;
                const presentes = pres.filter(p => p.estado.toLowerCase().includes("presente")).length;
                const taxa = totalSessoes > 0 ? Math.round((presentes / totalSessoes) * 100) : 0;

                return `
                    <div class="space-y-3">
                        <div class="flex flex-wrap items-center gap-4 bg-gray-50 p-3.5 rounded-xl border border-gray-100">
                            <div>
                                <span class="text-[11px] uppercase font-bold text-gray-400 block">Assiduidade em Plenário</span>
                                <span class="text-lg font-extrabold text-emerald-700">${taxa}%</span>
                                <span class="text-xs text-gray-500">(${presentes} de ${totalSessoes} sessões)</span>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2 max-h-60 overflow-y-auto pr-1">
                            ${pres.map(p => {
                                const ok = p.estado.toLowerCase().includes("presente");
                                return `
                                    <div class="px-3 py-2 rounded-lg border text-xs flex items-center justify-between ${ok ? 'bg-emerald-50/60 border-emerald-100 text-emerald-900' : 'bg-amber-50 border-amber-200 text-amber-900'}">
                                        <span class="font-semibold">${p.data}</span>
                                        <span class="text-[11px]">${p.estado}</span>
                                    </div>
                                `;
                            }).join("")}
                        </div>
                    </div>
                `;
            }
        }

        function renderizarDeputados(lista) {
            const grelha = document.getElementById("grelhaDeputados");
            grelha.innerHTML = "";

            if (lista.length === 0) {
                grelha.innerHTML = `<p class="col-span-full text-center text-gray-500 py-8">Nenhum deputado encontrado com estes filtros.</p>`;
                return;
            }

            const abas = [
                ["historico", "Atividade Parlamentar"],
                ["biografia", "Registo Biográfico"],
                ["interesses", "Registo de Interesses"],
                ["vencimentos", "Vencimentos"],
                ["presencas", "Presenças em Plenário"]
            ];

            lista.forEach((dep) => {
                const classeCor = coresPartidos[dep.partido] || "bg-gray-100 text-gray-800 border border-gray-200";
                const estaSelecionado = deputadoSelecionadoId === dep.id;

                const card = `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden border ${estaSelecionado ? 'col-span-full border-blue-500 ring-2 ring-blue-400/50' : 'border-gray-100 hover:shadow-xl hover:-translate-y-1'} transition-all duration-300">
                        <div onclick="alternarExpansao('${dep.id}')" class="${estaSelecionado ? 'flex flex-col sm:flex-row gap-6 p-6 cursor-pointer bg-gradient-to-r from-gray-50/80 to-white' : 'cursor-pointer'}">
                            <img src="${dep.foto}" alt="${dep.nome}" class="${estaSelecionado ? 'w-32 h-44 rounded-xl shadow-sm' : 'w-full h-72'} object-cover object-top bg-gray-200 flex-shrink-0">
                            <div class="${estaSelecionado ? 'flex-1 flex flex-col justify-between' : 'p-4'}">
                                <div>
                                    <div class="flex justify-between items-start">
                                        <span class="inline-block px-2.5 py-1 text-xs font-bold rounded-md mb-2 ${classeCor}">${dep.partido}</span>
                                        ${estaSelecionado ? '<span class="text-gray-400 hover:text-gray-700 text-2xl font-bold leading-none px-2">&times;</span>' : ''}
                                    </div>
                                    <h3 class="${estaSelecionado ? 'text-2xl font-bold text-gray-900' : 'font-bold text-lg text-gray-900'}">${dep.nome}</h3>
                                    <p class="${estaSelecionado ? 'text-sm text-gray-600 mt-1' : 'text-xs text-gray-500 mt-2'}">Círculo: <span class="font-semibold text-gray-800">${dep.circulo}</span></p>
                                </div>
                                ${estaSelecionado ? `
                                    <div class="flex flex-wrap gap-2 mt-4 pt-3 border-t border-gray-100" onclick="event.stopPropagation()">
                                        ${abas.map(([chave, label]) => `
                                            <button onclick="mudarAba('${chave}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors ${abaAtiva === chave ? 'bg-blue-900 text-white shadow-xs' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}">
                                                ${label}
                                            </button>
                                        `).join("")}
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        ${estaSelecionado ? `
                            <div class="px-6 pb-6 pt-2 border-t border-gray-100">
                                ${renderizarConteudoAba(dep)}
                            </div>
                        ` : ''}
                    </div>
                `;
                grelha.innerHTML += card;
            });
        }

        function alternarExpansao(id) {
            if (deputadoSelecionadoId === id) {
                deputadoSelecionadoId = null;
            } else {
                deputadoSelecionadoId = id;
                abaAtiva = "historico";
            }
            renderizarDeputados(listaAtual);
        }

        function mudarAba(novaAba) {
            abaAtiva = novaAba;
            renderizarDeputados(listaAtual);
        }

        function filtrarDeputados() {
            deputadoSelecionadoId = null;
            const partidoSelecionado = document.getElementById("filtroPartido").value;
            const circuloSelecionado = document.getElementById("filtroCirculo").value;

            listaAtual = deputados.filter(dep => {
                const matchPartido = partidoSelecionado === "" || dep.partido === partidoSelecionado;
                const matchCirculo = circuloSelecionado === "" || dep.circulo === circuloSelecionado;
                return matchPartido && matchCirculo;
            });

            renderizarDeputados(listaAtual);
        }

        // ==================== LÓGICA DE COMISSÕES (APENAS ATUAIS + MESA) ====================
        function normalizarTexto(str) {
            return (str || "")
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .trim();
        }

        function extrairNomeEPeriodo(entrada) {
            const idx = entrada.indexOf(" - ");
            if (idx === -1) return { nome: entrada.trim(), periodo: "" };
            return {
                nome: entrada.slice(0, idx).trim(),
                periodo: entrada.slice(idx + 3).trim()
            };
        }

        function detetarCargoNaComissao(listaCargos, nomeComissao) {
            if (!listaCargos || listaCargos.length === 0) return null;

            const nucleoComissao = normalizarTexto(nomeComissao)
                .replace(/^comissao\s+(permanente\s+|eventual\s+)?(de\s+|da\s+|do\s+|dos\s+|das\s+)?/, "")
                .trim();

            for (const item of listaCargos) {
                const parte = normalizarTexto(item);
                if (!parte || parte.startsWith("cargos que desempenha")) continue;

                // Verifica se a frase menciona o nome da comissão (ex: "assuntos parlamentares, ambiente...")
                if (nucleoComissao && parte.includes(nucleoComissao)) {
                    if (parte.includes("president")) return "presidente";
                    if (parte.includes("secretari")) return "secretario";
                    if (parte.includes("relator")) return "relator";
                }
            }

            return null;
        }

        function construirComissoesAtuais() {
            const mapa = new Map();

            deputados.forEach(dep => {
                const h = dep.historico || {};
                const atuais = h.comissoes_atuais || [];

                // Recolhe todos os textos de cargos possíveis (do histórico e da biografia)
                const listaCargos = [
                    ...(h.cargos_desempenha || []),
                    ...(h.periodos || []),
                    ...((dep.biografia && dep.biografia.cargos) ? dep.biografia.cargos.split(/[;\n]+/) : [])
                ];

                atuais.forEach(raw => {
                    const { nome, periodo } = extrairNomeEPeriodo(raw);
                    if (!nome) return;
                    const chave = normalizarTexto(nome);

                    if (!mapa.has(chave)) {
                        mapa.set(chave, {
                            key: chave,
                            nome,
                            membrosMap: new Map()
                        });
                    }

                    const com = mapa.get(chave);
                    if (!com.membrosMap.has(dep.id)) {
                        const cargo = detetarCargoNaComissao(listaCargos, nome);

                        com.membrosMap.set(dep.id, {
                            id: dep.id,
                            nome: dep.nome,
                            partido: dep.partido,
                            circulo: dep.circulo,
                            foto: dep.foto,
                            periodo,
                            cargo
                        });
                    }
                });
            });

            return Array.from(mapa.values()).sort((a, b) => a.nome.localeCompare(b.nome, "pt"));
        }


        function renderizarCartaoMembroComissao(m, tituloCargo = null) {
            const cor = coresPartidos[m.partido] || "bg-gray-100 text-gray-800 border border-gray-200";
            const destaqueMesa = Boolean(tituloCargo);

            return `
                <div class="flex items-center gap-4 p-4 rounded-xl border ${destaqueMesa ? 'bg-blue-50/50 border-blue-200 shadow-xs' : 'bg-gray-50 border-gray-100'}">
                    <img src="${m.foto}" alt="${m.nome}" class="w-20 h-28 object-cover object-top rounded-xl shadow-xs bg-gray-200 flex-shrink-0">
                    <div class="min-w-0 flex-1">
                        ${tituloCargo ? `
                            <span class="inline-block px-2.5 py-0.5 text-[11px] font-extrabold uppercase tracking-wider rounded-md bg-blue-900 text-white mb-1.5">
                                ${tituloCargo}
                            </span>
                        ` : ''}
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="inline-block px-2 py-0.5 text-[11px] font-bold rounded ${cor}">${m.partido}</span>
                            <span class="text-xs text-gray-500">${m.circulo}</span>
                        </div>
                        <p class="text-base font-bold text-gray-900 mt-1 leading-snug">${m.nome}</p>
                        ${m.periodo ? `<p class="text-xs text-gray-500 mt-1">${m.periodo}</p>` : ''}
                    </div>
                </div>
            `;
        }

        function renderizarComissoes() {
            const container = document.getElementById("listaComissoes");
            if (!container) return;

            const termo = normalizarTexto(document.getElementById("pesquisaComissao")?.value || "");
            let comissoes = construirComissoesAtuais();

            if (termo) {
                comissoes = comissoes.filter(c => {
                    const matchNomeCom = normalizarTexto(c.nome).includes(termo);
                    const matchMembro = Array.from(c.membrosMap.values()).some(m => normalizarTexto(m.nome).includes(termo));
                    return matchNomeCom || matchMembro;
                });
            }

            if (comissoes.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-gray-500 py-8">Nenhuma comissão atual encontrada.</p>`;
                return;
            }

            container.innerHTML = comissoes.map(com => {
                const aberta = comissaoSelecionadaKey === com.key;
                const todos = Array.from(com.membrosMap.values());

                // Calcular resumo da comissão (partidos e círculos)
                const porPartido = {};
                const porCirculo = {};
                todos.forEach(m => {
                    const p = (m.partido || "N/D").trim();
                    const c = (m.circulo || "N/D").trim();
                    porPartido[p] = (porPartido[p] || 0) + 1;
                    porCirculo[c] = (porCirculo[c] || 0) + 1;
                });

                const partidosOrd = Object.entries(porPartido).sort((a, b) => b[1] - a[1]);
                const circulosOrd = Object.entries(porCirculo).sort((a, b) => b[1] - a[1]);

                const badgesPartidos = partidosOrd.map(([sigla, qtd]) => {
                    const cor = coresPartidos[sigla] || "bg-gray-100 text-gray-800 border border-gray-200";
                    return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold ${cor}">${sigla} <span class="opacity-80">(${qtd})</span></span>`;
                }).join("");

                const badgesCirculos = circulosOrd.map(([ilha, qtd]) => `
                    <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-lg text-[11px] font-medium bg-white border border-gray-200 text-gray-700">
                        ${ilha} <strong class="text-blue-900">(${qtd})</strong>
                    </span>
                `).join("");

                // Separar Mesa e Restantes Membros
                const presidente = todos.find(m => m.cargo === "presidente");
                const secretario = todos.find(m => m.cargo === "secretario");
                const relator = todos.find(m => m.cargo === "relator");

                const idsMesa = new Set([presidente?.id, secretario?.id, relator?.id].filter(Boolean));
                const restantes = todos
                    .filter(m => !idsMesa.has(m.id))
                    .sort((a, b) => a.nome.localeCompare(b.nome, "pt"));

                return `
                    <section class="bg-white rounded-2xl shadow-sm border ${aberta ? 'col-span-full border-blue-500 ring-2 ring-blue-400/40 shadow-md' : 'border-gray-100 hover:shadow-md hover:-translate-y-0.5'} transition-all duration-300 overflow-hidden flex flex-col justify-between">
                        <!-- Cabeçalho Compacto Clicável -->
                        <div onclick="alternarComissao('${encodeURIComponent(com.key)}')" class="p-5 ${aberta ? 'md:px-8 md:pt-7 md:pb-5 bg-gradient-to-r from-gray-50/80 to-white border-b border-gray-100' : 'h-full flex flex-col justify-between'} cursor-pointer">
                            <div class="flex items-start justify-between gap-3">
                                <div>
                                    <span class="inline-block px-2.5 py-0.5 text-[10px] font-bold uppercase tracking-wider rounded-md bg-emerald-100 text-emerald-800 border border-emerald-200 mb-2">
                                        Em Funcionamento
                                    </span>
                                    <h3 class="${aberta ? 'text-xl md:text-2xl' : 'text-base'} font-bold text-gray-900 leading-snug">
                                        ${com.nome}
                                    </h3>
                                </div>
                                ${aberta
                                    ? `<span class="text-gray-400 hover:text-gray-700 text-2xl font-bold leading-none px-1">&times;</span>`
                                    : ''
                                }
                            </div>

                            <!-- Mini-resumo de partidos visível mesmo no cartão compacto -->
                            ${!aberta ? `
                                <div class="flex flex-wrap gap-1.5 mt-3">
                                    ${partidosOrd.map(([sigla, qtd]) => {
                                        const cor = coresPartidos[sigla] || "bg-gray-100 text-gray-800 border border-gray-200";
                                        return `<span class="px-2 py-0.5 rounded text-[10px] font-bold ${cor}">${sigla} ${qtd}</span>`;
                                    }).join("")}
                                </div>
                            ` : ''}

                            <div class="flex items-center justify-between mt-4 pt-3 ${aberta ? '' : 'border-t border-gray-100'}">
                                <span class="text-xs font-semibold text-gray-500">
                                    ${todos.length} deputado(s)
                                </span>
                                <span class="text-xs font-bold text-blue-900">
                                    ${aberta ? 'Recolher ▲' : 'Ver membros ▼'}
                                </span>
                            </div>
                        </div>

                        <!-- Conteúdo Expandido -->
                        ${aberta ? `
                            <div class="p-6 md:p-8 space-y-6">
                                <!-- Resumo da Composição da Comissão -->
                                <div class="bg-gray-50 rounded-xl border border-gray-100 p-4 md:p-5 grid grid-cols-1 lg:grid-cols-12 gap-4 items-center">
                                    <div class="lg:col-span-2 flex items-center gap-3 lg:border-r lg:border-gray-200 lg:pr-4">
                                        <div class="bg-blue-100 text-blue-950 rounded-xl px-3.5 py-2 text-center w-full lg:w-auto">
                                            <span class="block text-[10px] font-bold uppercase tracking-wider text-blue-800">Membros</span>
                                            <span class="text-xl font-extrabold">${todos.length}</span>
                                        </div>
                                    </div>

                                    <div class="lg:col-span-5 space-y-1.5">
                                        <span class="block text-[10px] font-bold uppercase tracking-wider text-gray-400">Distribuição Partidária</span>
                                        <div class="flex flex-wrap gap-1.5">${badgesPartidos}</div>
                                    </div>

                                    <div class="lg:col-span-5 space-y-1.5">
                                        <span class="block text-[10px] font-bold uppercase tracking-wider text-gray-400">Representação por Círculo / Ilha</span>
                                        <div class="flex flex-wrap gap-1.5">${badgesCirculos}</div>
                                    </div>
                                </div>

                                <!-- Mesa da Comissão -->
                                <div>
                                    <h4 class="text-xs font-bold uppercase tracking-wider text-blue-900 mb-3">Mesa da Comissão</h4>
                                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        ${presidente
                                            ? renderizarCartaoMembroComissao(presidente, "Presidente")
                                            : `<div class="p-4 rounded-xl border border-dashed border-gray-200 bg-gray-50/50 flex items-center justify-center text-xs text-gray-400">Presidente não identificado</div>`}
                                        ${secretario
                                            ? renderizarCartaoMembroComissao(secretario, "Secretário(a)")
                                            : `<div class="p-4 rounded-xl border border-dashed border-gray-200 bg-gray-50/50 flex items-center justify-center text-xs text-gray-400">Secretário(a) não identificado(a)</div>`}
                                        ${relator
                                            ? renderizarCartaoMembroComissao(relator, "Relator(a)")
                                            : `<div class="p-4 rounded-xl border border-dashed border-gray-200 bg-gray-50/50 flex items-center justify-center text-xs text-gray-400">Relator(a) não identificado(a)</div>`}
                                    </div>
                                </div>

                                <!-- Restantes Membros Atuais -->
                                ${restantes.length > 0 ? `
                                    <div>
                                        <h4 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-3">Restantes Membros (${restantes.length})</h4>
                                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                            ${restantes.map(m => renderizarCartaoMembroComissao(m)).join("")}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        ` : ''}
                    </section>
                `;
            }).join("");
        }



        function alternarComissao(encodedKey) {
            const key = decodeURIComponent(encodedKey);
            comissaoSelecionadaKey = comissaoSelecionadaKey === key ? null : key;
            renderizarComissoes();
        }

        carregarDeputados();
    </script>
</body>
</html>
